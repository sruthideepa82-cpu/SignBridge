<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SignBridge · Sign to Voice</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <main class="app">
      <h1 class="title">What if AI could translate sign language into voice?</h1>

      <section class="stage" aria-label="Live sign recognition">
        <div class="video-frame" id="frame">
          <video id="video" playsinline muted></video>
          <canvas id="overlay"></canvas>
          <div class="caption" id="caption" role="status" aria-live="polite" hidden>
            <p class="caption-text"></p>
            <p class="caption-note" hidden></p>
          </div>
          <div class="gloss-strip" id="gloss-strip" aria-label="Recognised signs" aria-live="polite"></div>
          <button type="button" class="clear-btn" id="clear-btn">Clear</button>
          <div class="sign-pill" id="sign-pill" aria-live="polite">
            <span class="pill-word">—</span>
            <span class="pill-bar"><span class="pill-bar-fill"></span></span>
            <span class="pill-hint">Show a sign</span>
          </div>
          <span class="face-tag" id="face-tag" hidden></span>
          <ul class="emotion-legend" aria-label="Facial emotion">
            <li data-emotion="Happy"><span class="emotion-dot"></span>Happy</li>
            <li data-emotion="Sad"><span class="emotion-dot"></span>Sad</li>
            <li data-emotion="Neutral"><span class="emotion-dot"></span>Neutral</li>
            <li data-emotion="Angry"><span class="emotion-dot"></span>Angry</li>
            <li data-emotion="Questioning"><span class="emotion-dot"></span>Questioning</li>
            <li data-emotion="Skeptical"><span class="emotion-dot"></span>Skeptical</li>
          </ul>
          <div id="camera-message" class="camera-message" role="status">Starting camera…</div>
        </div>
      </section>

      <nav class="pipeline" aria-label="Pipeline">
        <div class="step" data-step="tracking"><span class="indicator"></span><span>Hand Tracking</span></div>
        <div class="step" data-step="emotion"><span class="indicator"></span><span>Emotion Detection</span></div>
        <div class="step" data-step="llm"><span class="indicator"></span><span>LLM Interpretation</span></div>
        <div class="step" data-step="voice"><span class="indicator wave" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span>Voice Output</span></div>
      </nav>

      <p id="state-label" class="state-label">State: idle</p>
      <p id="model-caveat" class="model-caveat" role="note" hidden></p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
